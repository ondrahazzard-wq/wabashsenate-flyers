<!doctype html>
<html>
<head>
<meta charset="utf-8">
<style>
  :root {
    --paper: #F4EDE0;
    --paper-dark: #E9DFCC;
    --ink: #1E1A17;
    --muted: #8A7F72;
    --scarlet: #B8101F;
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { width: 1080px; height: 1920px; overflow: hidden; }
  body {
    background:
      radial-gradient(1400px 1000px at 50% 40%, var(--paper) 0%, var(--paper-dark) 100%);
    color: var(--ink);
    font-family: "Lora", serif;
    position: relative;
  }
  .grain { position: absolute; inset: 0; opacity: .22; mix-blend-mode: multiply; pointer-events: none; }
  .mono { font-family: "Noto Sans Mono CJK SC", "Liberation Mono", monospace; }

  /* scarlet margin line like a legal pad */
  .margin { position: absolute; top: 0; bottom: 0; left: 118px; width: 3px; background: rgba(184,16,31,.55); }

  .wrap { position: absolute; left: 156px; right: 80px; top: 0; bottom: 0; }

  .masthead {
    position: absolute; top: 150px; left: 0; right: 0;
    display: flex; justify-content: space-between;
    font-size: 28px; letter-spacing: 0.16em; text-transform: uppercase; color: var(--muted);
  }
  .rules { position: absolute; top: 202px; left: 0; right: 0; }
  .rules div { height: 3px; background: var(--ink); }
  .rules div + div { height: 1px; margin-top: 6px; }

  h1 {
    position: absolute; top: 250px; left: -4px;
    font-weight: 700; font-size: 184px; line-height: 0.92; letter-spacing: -0.03em;
  }
  h1 em { font-style: italic; font-weight: 600; color: var(--scarlet); }

  .items { position: absolute; top: 880px; left: 0; right: 0; list-style: none; }
  .items li {
    display: flex; align-items: baseline; gap: 24px;
    font-size: 44px; line-height: 1; padding: 22px 0;
    border-bottom: 1px dashed rgba(30,26,23,.25);
  }
  .items .n { font-size: 32px; color: var(--muted); width: 58px; }
  .items .t { white-space: nowrap; }
  .items .lead { flex: 1; }
  .items .chk { font-size: 34px; color: var(--muted); }
  .items li.done .t { color: var(--muted); }
  .items li.you { border-bottom: none; }
  .items li.you .t { font-weight: 700; font-size: 54px; }
  .items li.you .n { color: var(--scarlet); font-weight: 700; }
  .items li.you .chk {
    font-family: "Inter Display", sans-serif; font-weight: 800; font-size: 30px; letter-spacing: .14em;
    color: var(--paper); background: var(--scarlet); padding: 12px 18px 10px; border-radius: 7px;
  }

  /* stamp, angled, beside "your" */
  .stamp {
    position: absolute; top: 440px; right: -6px; transform: rotate(-9deg);
    border: 6px solid var(--scarlet); border-radius: 16px; padding: 16px 26px 12px;
    color: var(--scarlet); text-align: center; opacity: .88;
    font-family: "Inter Display", sans-serif; font-weight: 900; letter-spacing: .12em; text-transform: uppercase;
  }
  .stamp .big { font-size: 52px; line-height: 1; }
  .stamp .small { font-size: 20px; letter-spacing: .3em; margin-top: 6px; }

  .ideas {
    position: absolute; top: 1318px; left: 0; right: 0;
    font-size: 32px; line-height: 1.45; color: var(--muted);
  }
  .cue { position: absolute; top: 1540px; left: 0; right: 0; }
  .cue .lbl { font-size: 26px; letter-spacing: .16em; text-transform: uppercase; color: var(--muted); }
  .cue .big {
    margin-top: 14px; display: flex; align-items: center; justify-content: space-between;
    font-style: italic; font-weight: 700; font-size: 92px; line-height: 1; letter-spacing: -0.02em;
    color: var(--scarlet);
  }
  .cue svg { width: 84px; height: 84px; flex: none; }

  .foot {
    position: absolute; top: 1772px; left: 0; right: 0;
    display: flex; justify-content: space-between; align-items: baseline;
    font-size: 28px; letter-spacing: 0.06em; color: var(--muted);
  }
</style>
</head>
<body>
  <svg class="grain" width="1080" height="1920" xmlns="http://www.w3.org/2000/svg">
    <filter id="n"><feTurbulence type="fractalNoise" baseFrequency="0.75" numOctaves="3" stitchTiles="stitch"/><feColorMatrix type="saturate" values="0"/></filter>
    <rect width="100%" height="100%" filter="url(#n)"/>
  </svg>
  <div class="margin"></div>

  <div class="wrap">
    <div class="masthead mono"><span>Student Senate</span><span>Weekly agenda</span></div>
    <div class="rules"><div></div><div></div></div>

    <h1>What’s on<br><em>your</em><br>agenda?</h1>

    <div class="stamp"><div class="big">Open floor</div><div class="small">Every week</div></div>

    <ul class="items mono">
      <li class="done"><span class="n">01</span><span class="t">Call to order</span><span class="lead"></span><span class="chk">✓</span></li>
      <li class="done"><span class="n">02</span><span class="t">Roll call</span><span class="lead"></span><span class="chk">✓</span></li>
      <li class="done"><span class="n">03</span><span class="t">Committee reports</span><span class="lead"></span><span class="chk">✓</span></li>
      <li class="you"><span class="n">04</span><span class="t">New business</span><span class="lead"></span><span class="chk">YOU</span></li>
    </ul>

    <p class="ideas mono">e.g. dining hours, parking, club funding,<br>Wi-Fi, events you want to see...</p>

    <div class="cue">
      <div class="lbl mono">To add an item</div>
      <div class="big">Reply to this story
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3v18M4.5 13.5 12 21l7.5-7.5"/></svg>
      </div>
    </div>

    <div class="foot mono"><span>@wabashsenate</span><span>WABASH COLLEGE</span></div>
  </div>
</body>
</html>
